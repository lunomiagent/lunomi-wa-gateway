services:
  - type: web
    name: lunomi-wa-gateway
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /status
    envVars:
      - key: PORT
        value: 3001
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: GOOGLE_GENERATIVE_AI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://openagentic.id/api/v1
      - key: LUNOMI_AGENT_MODEL
        value: claude-sonnet-4.5-thinking
      - key: CRON_SECRET
        sync: false